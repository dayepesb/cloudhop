<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="cloudhop">
  <defs>
    <linearGradient id="ch-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19c3d1"/>
      <stop offset="1" stop-color="#0a6a82"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#ch-bg)"/>
  <!-- the cloud you leave -->
  <path d="M8.5 47.5a5.5 5.5 0 0 1 5-5.5 6.8 6.8 0 0 1 13 1.6 4.4 4.4 0 0 1-.9 8.7H13.4a4.9 4.9 0 0 1-4.9-4.8z" fill="#fff" fill-opacity=".55"/>
  <!-- the cloud you land on -->
  <path d="M31 44.6a7.6 7.6 0 0 1 7-7.6 9.6 9.6 0 0 1 18.2 2.6 6.3 6.3 0 0 1-1.3 12.5H38.3A7.4 7.4 0 0 1 31 44.6z" fill="#fff"/>
  <!-- the hop -->
  <path d="M18 37.5C19 21 33 13.5 40.6 23" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="0.01 6.3"/>
  <path d="M46 30.2l-7.4-2.1 5.4-4.3z" fill="#fff" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
