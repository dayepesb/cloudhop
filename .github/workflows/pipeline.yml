# Checks every push and pull request. On main, once everything passes, it waits
# for a person to approve the "release" environment, then publishes to npm and
# deploys the documentation site to GitHub Pages.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly security scan, even without new commits

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ───────────── Quality ─────────────
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck

  # ───────────── Tests ─────────────
  test:
    name: Unit + CLI tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm build
      - name: CLI end-to-end tests (bundled CLI, sandboxed config)
        run: pnpm test:e2e

  web:
    name: Web UI tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:web
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ───────────── Security ─────────────
  codeql:
    name: CodeQL (static analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript, actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm audit --audit-level high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only, AGPL-3.0-only

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────── Build what will ship ─────────────
  package:
    name: Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: meta
        run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Pack the npm tarball
        run: pnpm --filter cloudhop pack --pack-destination "$RUNNER_TEMP/pkg"
      - name: Smoke test the tarball as a user would install it
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          npm install --global --prefix "$RUNNER_TEMP/global" "$RUNNER_TEMP"/pkg/cloudhop-*.tgz
          "$RUNNER_TEMP/global/bin/hop" --version | grep -x "$VERSION"
          "$RUNNER_TEMP/global/bin/cloudhop" --help > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/pkg/cloudhop-*.tgz
          retention-days: 30

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  # ───────────── Release (main only) ─────────────
  approve:
    name: Approve release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, web, codeql, audit, secrets, package, docs]
    runs-on: ubuntu-latest
    # The "release" environment requires a reviewer: the run pauses here until approved in GitHub.
    environment: release
    steps:
      - env:
          VERSION: ${{ needs.package.outputs.version }}
        run: echo "Release of cloudhop $VERSION approved by $GITHUB_ACTOR."

  publish-npm:
    name: Publish to npm
    needs: [approve, package]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/cloudhop/v/${{ needs.package.outputs.version }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing (no token stored) and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: pkg
      - id: check
        name: Skip if this version is already on npm
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          if npm view "cloudhop@$VERSION" version > /dev/null 2>&1; then
            echo "cloudhop@$VERSION is already on npm; bump packages/cli/package.json to release." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        name: npm publish (trusted publishing + provenance)
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          npm --version
          # "./" matters: without it npm reads pkg/name.tgz as a GitHub owner/repo.
          npm publish ./pkg/cloudhop-*.tgz --access public
          echo "Published cloudhop@$VERSION." >> "$GITHUB_STEP_SUMMARY"

  deploy-docs:
    name: Deploy docs
    needs: [approve, docs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
