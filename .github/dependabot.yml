# Weekly PRs for outdated dependencies and GitHub Actions (pinned by commit SHA).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same version, so they update in one PR.
      codeql-action:
        patterns:
          - github/codeql-action*
