name: Bug report
description: Something does not work as described in the docs.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Security problems go through
        [private reporting](https://github.com/dayepesb/cloudhop/security/advisories/new) instead.
        Please remove account IDs, portal URLs and anything else private from the output.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Run the command again with `CLOUDHOP_DEBUG=1` and paste the output.
      render: shell
  - type: input
    id: version
    attributes:
      label: cloudhop version
      placeholder: cloudhop --version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Node and AWS CLI versions
      placeholder: macOS 15, Node 22.12, aws-cli 2.33.0
    validations:
      required: true
