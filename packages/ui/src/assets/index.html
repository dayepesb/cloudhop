<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cloudhop</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22 role=%22img%22 aria-label=%22cloudhop%22%3E%3Cdefs%3E%3ClinearGradient id=%22ch-bg%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%2319c3d1%22/%3E%3Cstop offset=%221%22 stop-color=%22%230a6a82%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22url(%23ch-bg)%22/%3E%3Cpath d=%22M8.5 47.5a5.5 5.5 0 0 1 5-5.5 6.8 6.8 0 0 1 13 1.6 4.4 4.4 0 0 1-.9 8.7H13.4a4.9 4.9 0 0 1-4.9-4.8z%22 fill=%22%23fff%22 fill-opacity=%22.55%22/%3E%3Cpath d=%22M31 44.6a7.6 7.6 0 0 1 7-7.6 9.6 9.6 0 0 1 18.2 2.6 6.3 6.3 0 0 1-1.3 12.5H38.3A7.4 7.4 0 0 1 31 44.6z%22 fill=%22%23fff%22/%3E%3Cpath d=%22M18 37.5C19 21 33 13.5 40.6 23%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%223.6%22 stroke-linecap=%22round%22 stroke-dasharray=%220.01 6.3%22/%3E%3Cpath d=%22M46 30.2l-7.4-2.1 5.4-4.3z%22 fill=%22%23fff%22 stroke=%22%23fff%22 stroke-width=%222.4%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --surface-2: #f1f3f6;
        --border: #e2e6eb;
        --text: #18202b;
        --muted: #5d6877;
        --accent: #0b8fa0;
        --accent-strong: #08707e;
        --accent-soft: #e0f4f6;
        --ok: #1f8a4c;
        --warn: #a86400;
        --bad: #c23934;
        --radius: 10px;
        --shadow: 0 1px 2px rgb(16 24 40 / 6%), 0 1px 3px rgb(16 24 40 / 8%);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f141a;
          --surface: #161d25;
          --surface-2: #1d2630;
          --border: #2a3542;
          --text: #e6ebf1;
          --muted: #93a1b1;
          --accent: #35c2d3;
          --accent-strong: #5fd3e1;
          --accent-soft: #123a41;
          --ok: #4cc27f;
          --warn: #e0a341;
          --bad: #f06b66;
          --shadow: none;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      /* biome-ignore lint/complexity/noImportantStyles: the hidden attribute must beat component display rules */
      [hidden] { display: none !important; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; }
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .bar {
        max-width: 1040px;
        margin: 0 auto;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .logo { font-weight: 700; font-size: 20px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
      .logo span span { color: var(--accent); }
      .tagline { color: var(--muted); font-size: 14px; }
      .spacer { flex: 1; }
      main { max-width: 1040px; margin: 0 auto; padding: 24px 20px 64px; }
      h2 { font-size: 15px; margin: 0; }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-bottom: 18px;
      }
      .card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }
      .card-head .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
      .card-body { padding: 4px 0; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        font: inherit;
        font-size: 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        padding: 6px 12px;
        cursor: pointer;
      }
      button:hover { background: var(--surface-2); }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { background: var(--accent-strong); }
      button.danger { color: var(--bad); }
      button.link { border: none; background: none; color: var(--muted); padding: 4px 6px; }
      button.link:hover { color: var(--bad); }
      button:disabled { opacity: 0.55; cursor: progress; }
      input, select {
        font: inherit;
        font-size: 14px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        min-width: 0;
      }
      table { width: 100%; border-collapse: collapse; }
      th {
        text-align: left;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        font-weight: 600;
        padding: 8px 16px;
      }
      td { padding: 8px 16px; border-top: 1px solid var(--border); vertical-align: middle; }
      td.alias { font-weight: 600; white-space: nowrap; }
      .region { display: flex; gap: 6px; align-items: center; }
      .region input { width: 140px; }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        padding: 2px 10px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .badge.valid { color: var(--ok); }
      .badge.refreshable { color: var(--warn); }
      .badge.expired { color: var(--bad); }
      .empty { padding: 14px 16px; color: var(--muted); }
      .missing { color: var(--bad); }
      .hero {
        text-align: center;
        padding: 48px 20px;
      }
      .hero p { color: var(--muted); max-width: 560px; margin: 8px auto 20px; }
      dialog {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 0;
        width: min(720px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 20px 60px rgb(0 0 0 / 30%);
      }
      dialog::backdrop { background: rgb(10 15 20 / 45%); }
      .dlg-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
      .dlg-head h2 { font-size: 17px; flex: 1; }
      .dlg-body { padding: 18px 20px; overflow: auto; max-height: calc(100vh - 200px); overflow-wrap: anywhere; }
      .dlg-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
      .dlg-foot .note { flex: 1; color: var(--muted); font-size: 13px; }
      .field { display: grid; gap: 4px; margin-bottom: 14px; }
      .field label { font-weight: 600; font-size: 14px; }
      .field .help { color: var(--muted); font-size: 13px; }
      .choices { display: grid; gap: 8px; margin-bottom: 16px; }
      .choice {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
      }
      .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
      .choice small { display: block; color: var(--muted); }
      .targets { display: grid; gap: 6px; }
      .target {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 10px;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px;
      }
      .target:has(input[type="checkbox"]:checked) { border-color: var(--accent); }
      .target .pick { display: contents; cursor: pointer; }
      .target .already { display: block; color: var(--muted); font-size: 13px; }
      .target .inputs { grid-column: 2; display: none; gap: 8px; flex-wrap: wrap; }
      .target:has(input[type="checkbox"]:checked) .inputs { display: flex; }
      .target .inputs input { flex: 1 1 160px; }
      .waiting { text-align: center; padding: 28px 8px; }
      .spinner {
        width: 28px; height: 28px; margin: 0 auto 14px;
        border: 3px solid var(--border); border-top-color: var(--accent);
        border-radius: 50%; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 10; }
      .toast {
        background: var(--text);
        color: var(--bg);
        padding: 10px 14px;
        border-radius: 10px;
        max-width: 420px;
        box-shadow: 0 6px 20px rgb(0 0 0 / 25%);
        font-size: 14px;
      }
      .toast.error { background: var(--bad); color: #fff; }
      .toast small { display: block; opacity: 0.85; }
      .notice {
        border: 1px solid var(--border);
        border-left: 4px solid var(--warn);
        background: var(--surface);
        border-radius: var(--radius);
        padding: 10px 14px;
        margin-bottom: 18px;
      }
      .notice.error { border-left-color: var(--bad); }
      @media (max-width: 640px) {
        .tagline { display: none; }
        th:nth-child(3), td:nth-child(3) { display: none; }
        td, th { padding: 8px 10px; }
        td.alias { white-space: normal; overflow-wrap: anywhere; }
        .region input { width: 96px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <div class="logo"><img src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22 role=%22img%22 aria-label=%22cloudhop%22%3E%3Cdefs%3E%3ClinearGradient id=%22ch-bg%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%2319c3d1%22/%3E%3Cstop offset=%221%22 stop-color=%22%230a6a82%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22url(%23ch-bg)%22/%3E%3Cpath d=%22M8.5 47.5a5.5 5.5 0 0 1 5-5.5 6.8 6.8 0 0 1 13 1.6 4.4 4.4 0 0 1-.9 8.7H13.4a4.9 4.9 0 0 1-4.9-4.8z%22 fill=%22%23fff%22 fill-opacity=%22.55%22/%3E%3Cpath d=%22M31 44.6a7.6 7.6 0 0 1 7-7.6 9.6 9.6 0 0 1 18.2 2.6 6.3 6.3 0 0 1-1.3 12.5H38.3A7.4 7.4 0 0 1 31 44.6z%22 fill=%22%23fff%22/%3E%3Cpath d=%22M18 37.5C19 21 33 13.5 40.6 23%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%223.6%22 stroke-linecap=%22round%22 stroke-dasharray=%220.01 6.3%22/%3E%3Cpath d=%22M46 30.2l-7.4-2.1 5.4-4.3z%22 fill=%22%23fff%22 stroke=%22%23fff%22 stroke-width=%222.4%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E" alt="" width="28" height="28" /><span>cloud<span>hop</span></span></div>
        <div class="tagline">Hop between cloud accounts, roles and regions</div>
        <div class="spacer"></div>
        <button type="button" class="primary" id="add-source" hidden>+ Add source</button>
      </div>
    </header>
    <main id="main" aria-live="polite">
      <div class="waiting"><div class="spinner"></div>Loading…</div>
    </main>
    <dialog id="dialog"></dialog>
    <div id="toasts" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
