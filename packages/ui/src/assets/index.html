<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cloudhop</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22 role=%22img%22 aria-label=%22cloudhop%22%3E%3Cdefs%3E%3ClinearGradient id=%22ch-bg%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%233BB8F5%22/%3E%3Cstop offset=%221%22 stop-color=%22%231450A8%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22url(%23ch-bg)%22/%3E%3Cpath d=%22M8.5 47.5a5.5 5.5 0 0 1 5-5.5 6.8 6.8 0 0 1 13 1.6 4.4 4.4 0 0 1-.9 8.7H13.4a4.9 4.9 0 0 1-4.9-4.8z%22 fill=%22%23fff%22 fill-opacity=%22.55%22/%3E%3Cpath d=%22M31 44.6a7.6 7.6 0 0 1 7-7.6 9.6 9.6 0 0 1 18.2 2.6 6.3 6.3 0 0 1-1.3 12.5H38.3A7.4 7.4 0 0 1 31 44.6z%22 fill=%22%23fff%22/%3E%3Cpath d=%22M18 37.5C19 21 33 13.5 40.6 23%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%223.6%22 stroke-linecap=%22round%22 stroke-dasharray=%220.01 6.3%22/%3E%3Cpath d=%22M46 30.2l-7.4-2.1 5.4-4.3z%22 fill=%22%23fff%22 stroke=%22%23fff%22 stroke-width=%222.4%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E" />
    <style>
      /* cloudhop palette "sky and coral": sky/blue for accents and focus, coral for the main action. */
      :root {
        --bg: #f6f8fc;
        --surface: #ffffff;
        --surface-2: #eef2f9;
        --border: #dde3ef;
        --text: #0f1730;
        --muted: #55617d;
        --accent: #1767c2;
        --accent-strong: #0f4e99;
        --accent-soft: #dcebfb;
        --cta: #c2410c;
        --cta-strong: #9a3412;
        --on-cta: #ffffff;
        --ok: #1a7f52;
        --warn: #8a5a00;
        --bad: #be123c;
        --on-bad: #ffffff;
        --radius: 10px;
        --shadow: 0 1px 2px rgb(15 23 48 / 6%), 0 1px 3px rgb(15 23 48 / 8%);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1124;
          --surface: #141c33;
          --surface-2: #1b2540;
          --border: #2a3555;
          --text: #e8ecf7;
          --muted: #9aa6c3;
          --accent: #3bb8f5;
          --accent-strong: #7fd0fa;
          --accent-soft: #12304f;
          --cta: #ff7a59;
          --cta-strong: #ff9478;
          --on-cta: #2a0e05;
          --ok: #4cd19a;
          --warn: #f5b84b;
          --bad: #fb7185;
          --on-bad: #2b0509;
          --shadow: none;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      /* biome-ignore lint/complexity/noImportantStyles: the hidden attribute must beat component display rules */
      [hidden] { display: none !important; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; }
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .bar {
        max-width: 1040px;
        margin: 0 auto;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .logo { font-weight: 700; font-size: 20px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
      .logo span span { color: var(--cta); }
      .tagline { color: var(--muted); font-size: 14px; }
      .spacer { flex: 1; }
      main { max-width: 1040px; margin: 0 auto; padding: 24px 20px 64px; }
      h2 { font-size: 15px; margin: 0; }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-bottom: 18px;
      }
      .card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }
      .card-head .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
      .card-body { padding: 4px 0; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        font: inherit;
        font-size: 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        padding: 6px 12px;
        cursor: pointer;
      }
      button:hover { background: var(--surface-2); }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      button.primary { background: var(--cta); border-color: var(--cta); color: var(--on-cta); font-weight: 600; }
      button.primary:hover { background: var(--cta-strong); border-color: var(--cta-strong); }
      button.danger { color: var(--bad); }
      button.link { border: none; background: none; color: var(--muted); padding: 4px 6px; }
      button.link:hover { color: var(--bad); }
      button:disabled { opacity: 0.55; cursor: progress; }
      input, select {
        font: inherit;
        font-size: 14px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        min-width: 0;
      }
      /* Fixed columns so every source's table lines up with the others. */
      table { width: 100%; border-collapse: collapse; table-layout: fixed; }
      table.aliases th:nth-child(1) { width: 22%; }
      table.aliases th:nth-child(2) { width: 15%; }
      table.aliases th:nth-child(3) { width: 180px; }
      table.aliases th:nth-child(5) { width: 264px; }
      td.muted { color: var(--muted); font-size: 14px; }
      .nav { display: flex; gap: 4px; margin-left: 12px; }
      .nav a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; padding: 6px 12px; border-radius: 8px; }
      .nav a:hover { color: var(--text); background: var(--surface-2); }
      .nav a[aria-current="page"] { color: var(--accent-strong); background: var(--accent-soft); font-weight: 600; }
      .page-head { display: flex; align-items: flex-end; gap: 16px; margin: 4px 0 16px; flex-wrap: wrap; }
      .page-head > div:first-child { flex: 1; min-width: 220px; }
      .page-head h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
      .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
      .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
      .toolbar input[type="search"] { flex: 1 1 260px; }
      .toolbar .count { color: var(--muted); font-size: 13px; }
      .source-summary { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--muted); }
      .card-body.padded { padding: 4px 16px 14px; }
      .snippet { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 6px 6px 12px; margin-bottom: 8px; }
      .snippet code { flex: 1; overflow-x: auto; white-space: nowrap; }
      .tool-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 0; }
      .tool-row .snippet { margin: 0; flex: 1 1 220px; }
      button.choice { width: 100%; text-align: left; background: var(--surface); }
      td { overflow-wrap: anywhere; }
      th {
        text-align: left;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        font-weight: 600;
        padding: 8px 16px;
      }
      td { padding: 8px 16px; border-top: 1px solid var(--border); vertical-align: middle; }
      td.alias { font-weight: 600; }
      .region { display: flex; gap: 6px; align-items: center; }
      .region input { width: 140px; }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        padding: 2px 10px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .badge.valid { color: var(--ok); }
      .badge.refreshable { color: var(--warn); }
      .badge.expired { color: var(--bad); }
      .empty { padding: 14px 16px; color: var(--muted); }
      .missing { color: var(--bad); }
      .hero {
        text-align: center;
        padding: 48px 20px;
      }
      .hero p { color: var(--muted); max-width: 560px; margin: 8px auto 20px; }
      dialog {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 0;
        width: min(720px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 20px 60px rgb(0 0 0 / 30%);
      }
      dialog::backdrop { background: rgb(10 15 20 / 45%); }
      .dlg-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
      .dlg-head h2 { font-size: 17px; flex: 1; }
      .dlg-body { padding: 18px 20px; overflow: auto; max-height: calc(100vh - 200px); overflow-wrap: anywhere; }
      .dlg-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
      .dlg-foot .note { flex: 1; color: var(--muted); font-size: 13px; }
      .field { display: grid; gap: 4px; margin-bottom: 14px; }
      .field label { font-weight: 600; font-size: 14px; }
      .field .help { color: var(--muted); font-size: 13px; }
      .choices { display: grid; gap: 8px; margin-bottom: 16px; }
      .choice {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
      }
      .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
      .choice small { display: block; color: var(--muted); }
      .targets { display: grid; gap: 6px; }
      .target {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 10px;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px;
      }
      .target:has(input[type="checkbox"]:checked) { border-color: var(--accent); }
      .target .pick { display: contents; cursor: pointer; }
      .target .already { display: block; color: var(--muted); font-size: 13px; }
      .target .inputs { grid-column: 2; display: none; gap: 8px; flex-wrap: wrap; }
      .target:has(input[type="checkbox"]:checked) .inputs { display: flex; }
      .target .inputs input { flex: 1 1 160px; }
      .waiting { text-align: center; padding: 28px 8px; }
      .spinner {
        width: 28px; height: 28px; margin: 0 auto 14px;
        border: 3px solid var(--border); border-top-color: var(--accent);
        border-radius: 50%; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 10; }
      .toast {
        background: var(--text);
        color: var(--bg);
        padding: 10px 14px;
        border-radius: 10px;
        max-width: 420px;
        box-shadow: 0 6px 20px rgb(0 0 0 / 25%);
        font-size: 14px;
      }
      .toast.error { background: var(--bad); color: var(--on-bad); }
      .toast small { display: block; opacity: 0.85; }
      .notice {
        border: 1px solid var(--border);
        border-left: 4px solid var(--warn);
        background: var(--surface);
        border-radius: var(--radius);
        padding: 10px 14px;
        margin-bottom: 18px;
      }
      .notice.error { border-left-color: var(--bad); }
      .row-actions { display: flex; gap: 6px; align-items: center; justify-content: flex-end; white-space: nowrap; }
      .prod-toggle { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); cursor: pointer; }
      .prod-tag { display: inline-block; white-space: nowrap; margin-left: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: var(--bad); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; vertical-align: 1px; }
      tr.prod td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
      button.link.danger-hover:hover { color: var(--bad); }
      .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .seg button { border: 0; border-radius: 0; }
      .seg button + button { border-left: 1px solid var(--border); }
      .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
      .card-help { color: var(--muted); font-size: 14px; margin: 10px 16px 6px; }
      .card-body.padded .card-help { margin: 8px 0 10px; }
      .muted-inline { color: var(--muted); font-weight: 400; font-size: 12px; }
      table.assistants th:nth-child(2) { width: 170px; }
      table.assistants th:nth-child(3) { width: 140px; }
      table.assistants th:nth-child(4) { width: 230px; }
      @media (max-width: 640px) {
        .tagline { display: none; }
        .nav { margin-left: 4px; overflow-x: auto; }
        .nav a { padding: 6px 8px; }
        table.aliases th:nth-child(2), table.aliases td:nth-child(2),
        table.aliases th:nth-child(4), table.aliases td:nth-child(4),
        table.assistants th:nth-child(3), table.assistants td:nth-child(3) { display: none; }
        td, th { padding: 8px 10px; }
        td.alias { white-space: normal; overflow-wrap: anywhere; }
        .region input { width: 96px; }
        table.aliases th:nth-child(1) { width: auto; }
        table.aliases th:nth-child(3) { width: 124px; }
        table.aliases th:nth-child(5) { width: 132px; }
        .bar { flex-wrap: wrap; }
        .row-actions { flex-wrap: wrap; }
        table.assistants th:nth-child(2) { width: 112px; }
        table.assistants th:nth-child(4) { width: 96px; }
        table.assistants .actions { flex-direction: column; align-items: flex-end; }
        .card-help { margin: 10px 10px 6px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <div class="logo"><img src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22 role=%22img%22 aria-label=%22cloudhop%22%3E%3Cdefs%3E%3ClinearGradient id=%22ch-bg%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%233BB8F5%22/%3E%3Cstop offset=%221%22 stop-color=%22%231450A8%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22url(%23ch-bg)%22/%3E%3Cpath d=%22M8.5 47.5a5.5 5.5 0 0 1 5-5.5 6.8 6.8 0 0 1 13 1.6 4.4 4.4 0 0 1-.9 8.7H13.4a4.9 4.9 0 0 1-4.9-4.8z%22 fill=%22%23fff%22 fill-opacity=%22.55%22/%3E%3Cpath d=%22M31 44.6a7.6 7.6 0 0 1 7-7.6 9.6 9.6 0 0 1 18.2 2.6 6.3 6.3 0 0 1-1.3 12.5H38.3A7.4 7.4 0 0 1 31 44.6z%22 fill=%22%23fff%22/%3E%3Cpath d=%22M18 37.5C19 21 33 13.5 40.6 23%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%223.6%22 stroke-linecap=%22round%22 stroke-dasharray=%220.01 6.3%22/%3E%3Cpath d=%22M46 30.2l-7.4-2.1 5.4-4.3z%22 fill=%22%23fff%22 stroke=%22%23fff%22 stroke-width=%222.4%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E" alt="" width="28" height="28" /><span>cloud<span>hop</span></span></div>
        <nav id="nav" class="nav" aria-label="Sections" hidden>
          <a href="#/aliases" data-page="aliases">Aliases</a>
          <a href="#/sources" data-page="sources">Sources</a>
          <a href="#/assistants" data-page="assistants">AI assistants</a>
          <a href="#/tools" data-page="tools">Tools</a>
        </nav>
        <div class="spacer"></div>
        <button type="button" class="primary" id="add-source" hidden>+ Add source</button>
      </div>
    </header>
    <main id="main" aria-live="polite">
      <div class="waiting"><div class="spinner"></div>Loading…</div>
    </main>
    <dialog id="dialog"></dialog>
    <div id="toasts" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
